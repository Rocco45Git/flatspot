<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlatSpot - The Open Flatpak Store</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent: #3584e4;
      --accent-hover: #1c71d8;
      --danger: #e01b24;
      --success: #2ec27e;
      --text: #ffffff;
      --text-muted: #a0a0b0;
      --border: #2d2d38;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding-bottom: 50px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
      background-color: #18181c;
      border-bottom: 1px solid var(--border);
    }

    .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
    .nav-buttons { display: flex; gap: 10px; }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: var(--accent-hover); }
    button.secondary { background-color: #2c2c36; color: var(--text); }
    button.secondary:hover { background-color: #3a3a48; }
    button.danger { background-color: var(--danger); }
    button.success { background-color: var(--success); }

    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    h2 { margin-bottom: 1rem; font-size: 1.4rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .card h3 { margin-bottom: 0.5rem; }
    .card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .badge { display: inline-block; background: #2a2a38; color: var(--accent); font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: bold; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 500px; padding: 2rem; }
    .modal h3 { margin-bottom: 1rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 0.6rem; background: #141418; border: 1px solid var(--border); border-radius: 6px; color: white;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.5rem; }

    /* Admin Panel */
    #admin-panel { display: none; background: #16161a; border: 1px solid var(--accent); border-radius: 12px; padding: 1.5rem; margin-bottom: 3rem; }
    .mod-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .mod-controls { display: flex; gap: 10px; margin-top: 1rem; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>

  <header>
    <div class="logo">📦 FlatSpot</div>
    <div class="nav-buttons">
      <button class="secondary" onclick="openModal('upload-modal')">Upload .flatpak</button>
      <button id="dev-btn" onclick="loginDev()">Dev Dashboard</button>
    </div>
  </header>

  <main>
    <!-- Moderator Dashboard Section -->
    <section id="admin-panel">
      <h2>🛡️ Moderator Review Queue</h2>
      <p style="color: var(--text-muted); margin-bottom: 1rem;" id="mod-welcome"></p>
      <div id="pending-list"></div>
    </section>

    <!-- Public Store Section -->
    <h2>Available Packages</h2>
    <div class="grid" id="store-list">
      <!-- Default Store Item -->
      <div class="card">
        <span class="badge">Console Tools</span>
        <h3 style="margin-top:0.5rem;">rterm</h3>
        <p>Custom CLI REPL & package manager environment.</p>
        <button onclick="alert('Download started for rterm.flatpak')">Get .flatpak</button>
      </div>
    </div>
  </main>

  <!-- Upload Modal -->
  <div class="modal-overlay" id="upload-modal">
    <div class="modal">
      <h3>Upload your App to FlatSpot</h3>
      <form id="upload-form" onsubmit="submitApp(event)">
        <div class="form-group">
          <label>App Name</label>
          <input type="text" id="app-name" required placeholder="e.g. MyCoolTool">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="app-desc" required placeholder="Short summary of what your app does..."></textarea>
        </div>
        <div class="form-group">
          <label>Select .flatpak File</label>
          <input type="file" id="app-file" accept=".flatpak" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary" onclick="closeModal('upload-modal')">Cancel</button>
          <button type="submit">Submit for Review</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Valid 8-digit access codes
    const MOD_CODES = {
      "19041459": "Rocco",
      "starfish": "Cody"
    };

    let currentUser = null;
    let pendingApps = [];
    let approvedApps = [];

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Handle user app submission
    function submitApp(e) {
      e.preventDefault();
      const name = document.getElementById('app-name').value;
      const desc = document.getElementById('app-desc').value;
      const file = document.getElementById('app-file').files[0];

      if (!file) return;

      const newApp = {
        id: Date.now(),
        name: name,
        desc: desc,
        fileName: file.name
      };

      pendingApps.push(newApp);
      alert(`"${name}" has been submitted! It will appear on the store once approved by a moderator.`);
      document.getElementById('upload-form').reset();
      closeModal('upload-modal');
      renderModQueue();
    }

    // Handle Dev Dashboard Login
    function loginDev() {
      if (currentUser) {
        // Toggle logout
        currentUser = null;
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('dev-btn').innerText = 'Dev Dashboard';
        document.getElementById('dev-btn').className = '';
        return;
      }

      const code = prompt("Enter 8-digit Developer / Moderator Access Code:");
      if (MOD_CODES[code]) {
        currentUser = MOD_CODES[code];
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('mod-welcome').innerText = `Logged in as Moderator: ${currentUser}`;
        document.getElementById('dev-btn').innerText = 'Log Out';
        document.getElementById('dev-btn').className = 'secondary';
        renderModQueue();
      } else if (code !== null) {
        alert("Invalid Access Code!");
      }
    }

    // Render Moderator Queue
    function renderModQueue() {
      const queueContainer = document.getElementById('pending-list');
      queueContainer.innerHTML = '';

      if (pendingApps.length === 0) {
        queueContainer.innerHTML = '<p style="color: var(--text-muted);">No apps currently waiting for review.</p>';
        return;
      }

      pendingApps.forEach((app, index) => {
        const item = document.createElement('div');
        item.className = 'mod-item';
        item.innerHTML = `
          <h3>${app.name} <small style="font-size: 0.8rem; color: var(--text-muted);">(${app.fileName})</small></h3>
          <p>${app.desc}</p>
          
          <div class="mod-controls">
            <!-- Approve Selection -->
            <select id="cat-${app.id}">
              <option value="">Select Category to Approve...</option>
              <option value="Console Tools">Console Tools</option>
              <option value="Games">Games</option>
              <option value="Utilities">Utilities</option>
              <option value="System">System</option>
            </select>
            <button class="success" onclick="approveApp(${index}, ${app.id})">YES (Approve)</button>

            <!-- Reject Reason Input -->
            <input type="text" id="reason-${app.id}" placeholder="Reason for rejection (min 5 words)..." style="flex-grow:1; min-width: 200px;">
            <button class="danger" onclick="rejectApp(${index}, ${app.id})">NO (Reject)</button>
          </div>
        `;
        queueContainer.appendChild(item);
      });
    }

    // Approve Logic
    function approveApp(index, appId) {
      const catSelect = document.getElementById(`cat-${appId}`);
      const category = catSelect.value;

      if (!category) {
        alert("Please select a category before approving!");
        return;
      }

      const app = pendingApps.splice(index, 1)[0];
      app.category = category;
      approvedApps.push(app);

      renderModQueue();
      renderStore();
    }

    // Reject Logic
    function rejectApp(index, appId) {
      const reasonInput = document.getElementById(`reason-${appId}`);
      const reason = reasonInput.value.trim();

      // Check for at least 5 words
      const wordCount = reason.split(/\s+/).filter(word => word.length > 0).length;

      if (wordCount < 5) {
        alert(`Rejection reason must be at least 5 words long! (Currently ${wordCount} words)`);
        return;
      }

      const app = pendingApps.splice(index, 1)[0];
      alert(`Rejected "${app.name}". Reason logged: "${reason}"`);
      renderModQueue();
    }

    // Render Published Apps to Store
    function renderStore() {
      const storeContainer = document.getElementById('store-list');
      // Keep initial default rterm item
      storeContainer.innerHTML = `
        <div class="card">
          <span class="badge">Console Tools</span>
          <h3 style="margin-top:0.5rem;">rterm</h3>
          <p>Custom CLI REPL & package manager environment.</p>
          <button onclick="alert('Downloading rterm.flatpak...')">Get .flatpak</button>
        </div>
      `;

      approvedApps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <span class="badge">${app.category}</span>
          <h3 style="margin-top:0.5rem;">${app.name}</h3>
          <p>${app.desc}</p>
          <button onclick="alert('Downloading ${app.fileName}...')">Get .flatpak</button>
        `;
        storeContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
